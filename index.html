<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Draw2Birthday2026 Smooth</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui;background:#fff;overscroll-behavior:none}
.header{background:#000;color:#fff;text-align:center;padding:16px;font-weight:800}
.wrap{max-width:900px;margin:auto;padding:12px}
#c{width:100%;height:65vh;min-height:500px;border:3px solid #000;border-radius:16px;display:block;touch-action:none;background:#fff}
.tools{display:flex;gap:8px;justify-content:center;margin:14px 0;flex-wrap:wrap}
.tools button,.tools input{padding:10px 16px;border:2px solid #000;border-radius:10px;font-weight:700}
.tools button.active{background:#000;color:#fff}
.stickers{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.stickers button{font-size:28px;padding:6px 12px;border:2px solid #000;border-radius:10px}
.inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.inputs input{padding:12px;border:2px solid #000;border-radius:10px;width:100%}
.action{display:flex;gap:10px;justify-content:center;margin:16px 0}
.action button{padding:14px 20px;border-radius:12px;font-weight:800;flex:1}
#saveBtn{background:#000;color:#fff} #clearBtn{background:#fff} #dlBtn{background:#ffde59}
</style>
</head>
<body>
<div class="header">🎂 Draw2Birthday2026 - Smooth Drawing</div>
<div class="wrap">
<canvas id="c"></canvas>
<div class="tools">
<button id="pen" class="active">✏️ Pen</button>
<button id="eraser">🧽 Eraser</button>
<input type="color" id="col" value="#000000">
<input type="range" id="sz" min="2" max="40" value="5">
</div>
<div class="stickers">
<button data-e="🎂">🎂</button><button data-e="🎈">🎈</button><button data-e="🎁">🎁</button><button data-e="🦄">🦄</button><button data-e="🌈">🌈</button><button data-e="❤️">❤️</button>
</div>
<div class="inputs"><input id="name" placeholder="Your Name"><input id="bdate" type="date"></div>
<div class="action"><button id="clearBtn">Clear</button><button id="dlBtn">Download</button><button id="saveBtn">Save + Rank</button></div>
<div style="border:2px solid #000;border-radius:12px;padding:14px;margin-top:12px"><h3>🏆 Top 25</h3><div id="board">No drawings yet</div></div>
</div>
<script>
const ca=document.getElementById('c'),cx=ca.getContext('2d');
let drawing=false,last=null,mode='pen';
function resize(){
const dpr=window.devicePixelRatio||1;
const r=ca.getBoundingClientRect();
ca.width=r.width*dpr;ca.height=r.height*dpr;
ca.style.width=r.width+'px';ca.style.height=r.height+'px';
cx.setTransform(dpr,0,0,dpr,0,0);
cx.lineCap='round';cx.lineJoin='round';
}
resize();setTimeout(resize,200);
function pos(e){
const r=ca.getBoundingClientRect();
const t=e.touches?e.touches[0]:e.changedTouches?e.changedTouches[0]:e;
return{x:t.clientX-r.left,y:t.clientY-r.top};
}
function s(e){e.preventDefault();drawing=true;last=pos(e);cx.beginPath();cx.moveTo(last.x,last.y);}
function m(e){
if(!drawing)return;e.preventDefault();
const p=pos(e);
cx.globalCompositeOperation=mode==='eraser'?'destination-out':'source-over';
cx.strokeStyle=col.value;cx.lineWidth=sz.value;
cx.lineTo(p.x,p.y);cx.stroke();
cx.beginPath();cx.moveTo(p.x,p.y);
last=p;
}
function e(e){if(!drawing)return;e.preventDefault();drawing=false;cx.closePath();cx.globalCompositeOperation='source-over';}
ca.addEventListener('mousedown',s);ca.addEventListener('mousemove',m);ca.addEventListener('mouseup',e);ca.addEventListener('mouseleave',e);
ca.addEventListener('touchstart',s,{passive:false});ca.addEventListener('touchmove',m,{passive:false});ca.addEventListener('touchend',e,{passive:false});ca.addEventListener('touchcancel',e,{passive:false});
pen.onclick=()=>{mode='pen';pen.classList.add('active');eraser.classList.remove('active');};
eraser.onclick=()=>{mode='eraser';eraser.classList.add('active');pen.classList.remove('active');};
clearBtn.onclick=()=>{const r=ca.getBoundingClientRect();cx.clearRect(0,0,r.width,r.height);cx.beginPath();};
dlBtn.onclick=()=>{const a=document.createElement('a');a.download='drawing.png';a.href=ca.toDataURL();a.click();};
document.querySelectorAll('.stickers button').forEach(b=>{b.onclick=()=>{cx.font='40px serif';const r=ca.getBoundingClientRect();cx.fillText(b.dataset.e,r.width/2,r.height/2);};});
let db=JSON.parse(localStorage.getItem('d2b')||'[]');
function rb(){board.innerHTML=db.length?db.map((d,i)=>`${i+1}. <b>${d.n}</b>`).join('<br>'):'No drawings yet';}rb();
saveBtn.onclick=()=>{const n=name.value||'Anon';const d=bdate.value||'';db.unshift({n,d});localStorage.setItem('d2b',JSON.stringify(db));rb();alert('Saved!');};
</script>
</body>
                                                                                             </html>
