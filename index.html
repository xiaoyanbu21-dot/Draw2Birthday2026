<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Draw2Birthday2026 Fixed</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui;background:#fff}
.header{background:#000;color:#fff;text-align:center;padding:16px;font-weight:bold}
.wrap{max-width:900px;margin:auto;padding:12px}
#c{width:100%;height:60vh;min-height:450px;border:3px solid #000;border-radius:12px;display:block;touch-action:none;cursor:crosshair;background:#fff}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.tools button,.tools input{padding:10px 14px;border:2px solid #000;border-radius:8px;font-weight:bold}
.tools button.active{background:#000;color:#fff}
.stickers{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.stickers button{font-size:28px;padding:6px 12px;border:2px solid #000;border-radius:8px}
.inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.inputs input{padding:12px;border:2px solid #000;border-radius:8px;width:100%}
.action{display:flex;gap:10px;justify-content:center;margin:16px 0}
.action button{padding:14px 20px;border-radius:10px;font-weight:bold;flex:1}
#saveBtn{background:#000;color:#fff;border:none}
#clearBtn{background:#fff;border:2px solid #000}
#dlBtn{background:#ffde59;border:2px solid #000}
</style>
</head>
<body>
<div class="header">🎂 Draw2Birthday2026 - Kindness Drawing</div>
<div class="wrap">
<canvas id="c"></canvas>
<div class="tools">
<button id="pen" class="active">✏️ Pen</button>
<button id="eraser">🧽 Eraser</button>
<input type="color" id="col" value="#000000">
<input type="range" id="sz" min="1" max="40" value="4">
</div>
<div class="stickers">
<button data-e="🎂">🎂</button><button data-e="🎈">🎈</button><button data-e="🎁">🎁</button><button data-e="🦄">🦄</button><button data-e="🌈">🌈</button><button data-e="❤️">❤️</button>
</div>
<div class="inputs"><input id="name" placeholder="Your Name"><input id="bdate" type="date"></div>
<div class="action"><button id="clearBtn">Clear</button><button id="dlBtn">Download</button><button id="saveBtn">Save + Rank</button></div>
<div style="border:2px solid #000;border-radius:12px;padding:12px;margin-top:10px"><h3>🏆 Top 25</h3><div id="board">No drawings yet</div></div>
</div>
<script>
const ca=document.getElementById('c'),cx=ca.getContext('2d');
let drawing=false,last={x:0,y:0},mode='pen';
function rs(){const r=ca.getBoundingClientRect(),d=window.devicePixelRatio||1;ca.width=r.width*d;ca.height=r.height*d;ca.style.width=r.width+'px';ca.style.height=r.height+'px';cx.setTransform(d,0,0,d,0,0);cx.lineCap='round';cx.lineJoin='round';}
rs();setTimeout(rs,100);
function P(e){const r=ca.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top};}
function S(e){e.preventDefault();drawing=true;last=P(e);cx.beginPath();cx.moveTo(last.x,last.y);}
function M(e){if(!drawing)return;e.preventDefault();const p=P(e);cx.globalCompositeOperation=mode==='eraser'?'destination-out':'source-over';cx.strokeStyle=document.getElementById('col').value;cx.lineWidth=document.getElementById('sz').value;cx.lineTo(p.x,p.y);cx.stroke();last=p;}
function E(e){if(!drawing)return;e.preventDefault();drawing=false;cx.closePath();cx.globalCompositeOperation='source-over';}
ca.addEventListener('mousedown',S);ca.addEventListener('mousemove',M);ca.addEventListener('mouseup',E);ca.addEventListener('mouseout',E);
ca.addEventListener('touchstart',S,{passive:false});ca.addEventListener('touchmove',M,{passive:false});ca.addEventListener('touchend',E,{passive:false});ca.addEventListener('touchcancel',E,{passive:false});
document.getElementById('pen').onclick=()=>{mode='pen';pen.classList.add('active');eraser.classList.remove('active');};
document.getElementById('eraser').onclick=()=>{mode='eraser';eraser.classList.add('active');pen.classList.remove('active');};
clearBtn.onclick=()=>{const r=ca.getBoundingClientRect();cx.clearRect(0,0,r.width,r.height);};
dlBtn.onclick=()=>{const a=document.createElement('a');a.download='drawing.png';a.href=ca.toDataURL();a.click();};
document.querySelectorAll('.stickers button').forEach(b=>{b.onclick=()=>{cx.font='40px serif';const r=ca.getBoundingClientRect();cx.fillText(b.dataset.e,r.width/2,r.height/2);};});
let db=JSON.parse(localStorage.getItem('d2b')||'[]');
function rb(){board.innerHTML=db.length?db.slice(0,25).map((d,i)=>`${i+1}. <b>${d.n}</b> - ${d.d}`).join('<br>'):'No drawings yet';}rb();
saveBtn.onclick=()=>{const n=name.value||'Anon';const d=bdate.value||new Date().toISOString().split('T')[0];db.unshift({n,d});db=db.slice(0,25);localStorage.setItem('d2b',JSON.stringify(db));rb();alert('Saved!');};
</script>
</body>
                                                                                              </html>
